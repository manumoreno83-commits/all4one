[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-google-drive-sheets"
version = "1.0.0"
description = "MCP server for Google Drive, Sheets and Excel integration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
mcp-google-drive-sheets = "src.server:main"
