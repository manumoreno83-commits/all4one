<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="white"/>

  <!-- Main shape: Ascending bars representing progress/training -->
  <g fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round">
    <!-- Bar 1 (ascending) -->
    <line x1="40" y1="120" x2="40" y2="70"/>

    <!-- Bar 2 (higher) -->
    <line x1="80" y1="110" x2="80" y2="50"/>

    <!-- Bar 3 (highest) -->
    <line x1="120" y1="100" x2="120" y2="40"/>

    <!-- Bar 4 (maintaining) -->
    <line x1="160" y1="100" x2="160" y2="50"/>

    <!-- Connecting line (trainer's vision) -->
    <path d="M 35 125 Q 100 20 165 45" stroke="#FF6B35" stroke-width="3" fill="none"/>
  </g>

  <!-- Small accent dot (action point) -->
  <circle cx="100" cy="90" r="4" fill="#FF6B35"/>
</svg>
